name: release
run-name: "release ${{ inputs.version || github.ref_name }}"

# Tag a version to publish it, e.g. `git tag v0.1.3 && git push rig v0.1.3`.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  desktop:
    # Apple silicon only. To also ship Intel, add a matrix entry on macos-26-intel
    # with platform_flag `--mac --x64` and bun_install_flags `--os=darwin --cpu=x64`.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The tag name reaches the shell through the environment, never through string
      # interpolation, and is charset-checked before anything else consumes it.
      - name: Resolve version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${RAW_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*$'; then
            echo "Refusing to build unrecognised version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Create BOTH the tag and the release up front, because electron-builder runs one
      # publisher per target (zip and DMG) and they race. In v0.2.2 both logged
      # "creating GitHub release reason=release doesn't exist" within 30ms and each made
      # its own release object for tag v0.2.2: the DMG + latest-mac.yml landed on one, the
      # CLI tarballs on the other, and users hit whichever the page showed first — with
      # their file missing. Pre-creating the release makes every publisher an uploader.
      # Both steps are idempotent, so re-runs and tag-triggered runs are no-ops.
      - name: Ensure release tag and draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            echo "Created tag $tag at $GITHUB_SHA"
          fi

          count="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$tag\")] | length")"
          if [ "$count" -gt 1 ]; then
            echo "Refusing to build: $count releases already exist for $tag." >&2
            echo "Delete the duplicates before re-running." >&2
            exit 1
          fi
          if [ "$count" -eq 1 ]; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --draft --title "$VERSION" --notes "" --repo "$GITHUB_REPOSITORY"
            echo "Created draft release $tag"
          fi

      # Signing is optional: without these the build still produces a DMG, just an
      # unsigned one. Setting APPLE_SIGNING_ENABLED turns on notarization with no edits here.
      - name: Import signing certificate
        if: vars.APPLE_SIGNING_ENABLED == 'true'
        uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Stage notarization key
        if: vars.APPLE_SIGNING_ENABLED == 'true'
        env:
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY }}
        run: printf '%s' "$APPLE_API_KEY_CONTENTS" > "$RUNNER_TEMP/apple-api-key.p8"

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --os=darwin --cpu=arm64

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.version.outputs.value }}
          RUST_TARGET: aarch64-apple-darwin

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.version.outputs.value }}

      # --publish always uploads the DMG, the zip, and latest-mac.yml into a DRAFT release
      # (see electron-builder.config.ts). That yml is the feed the in-app updater reads and
      # is unreadable while drafted, so the `finalize` job publishes the draft once every
      # artifact has landed.
      - name: Package and publish
        run: npx electron-builder --mac --arm64 --publish always --config electron-builder.config.ts
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEYCHAIN: ${{ vars.APPLE_SIGNING_ENABLED == 'true' && 'build.keychain' || '' }}
          APPLE_API_KEY: ${{ vars.APPLE_SIGNING_ENABLED == 'true' && format('{0}/apple-api-key.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # On arm64 hdiutil cannot create HFS+, so electron-builder falls back to APFS and
      # writes a classic HFS-style alias into .DS_Store to point at the background. Those
      # identifiers do not resolve on an APFS volume, so Finder silently renders a plain
      # grey window — no error, and a .DS_Store that inspects as perfect. Only Finder can
      # write an alias valid for the volume, which is what build/fix-dmg-background.sh does.
      #
      # It has to happen here rather than before `--publish always`, because that flag
      # uploads each artifact the moment it is built. Rewriting .DS_Store changes the DMG,
      # so its blockmap and its sha512/size in latest-mac.yml are regenerated and all three
      # assets replaced. Safe after the fact because the release is a DRAFT until
      # `finalize` runs, so users never see the intermediate state.
      #
      # This step needs Finder automation on the runner. If that is unavailable the script
      # fails rather than shipping grey, the job fails, finalize never runs, and the
      # release stays a draft — the same "incomplete is worse than late" policy as the
      # asset check below.
      - name: Render the DMG background and refresh the update feed
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          dmg=dist/opencode-desktop-mac-arm64.dmg
          ./build/fix-dmg-background.sh "$dmg"
          python3 build/refresh-update-feed.py dist/latest-mac.yml "$dmg"

          # app-builder is electron-builder's own blockmap tool and produces exactly the
          # sha512 it would have written. It is a transitive dependency, so it is located
          # by path rather than by `require` — bun's node_modules layout does not expose
          # it to the CJS resolver from this package.
          app_builder="$(find ../../node_modules -type f -name 'app-builder_arm64' \
            -path '*app-builder-bin*' -print -quit)"
          if [ -n "$app_builder" ]; then
            "$app_builder" blockmap --input "$dmg" --output "$dmg.blockmap"
            gh release upload "$TAG" "$dmg" "$dmg.blockmap" dist/latest-mac.yml --clobber
          else
            # Nothing references the DMG blockmap — macOS updates come from the .zip named
            # by the feed's `path:` — so dropping it is strictly better than leaving one
            # that describes the pre-fix file.
            echo "app-builder not found; removing the stale DMG blockmap instead"
            gh release delete-asset "$TAG" "$(basename "$dmg").blockmap" --yes || true
            gh release upload "$TAG" "$dmg" dist/latest-mac.yml --clobber
          fi

  cli:
    # build.ts uploads to an existing release (`gh release upload`) rather than
    # creating one; the desktop job is what actually creates it via electron-builder's
    # `--publish always`, ~7 minutes into its run. Without this, cli's ~2 minute build
    # finishes first and every leg fails with "release not found".
    needs: desktop
    strategy:
      # One bad leg must not cancel the others — each uploads its own artifact, so a
      # partial release beats a release that loses three good binaries to one failure.
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            install-flags: "--os=darwin --cpu=arm64"
          - runner: macos-26-intel
            install-flags: "--os=darwin --cpu=x64"
          - runner: ubuntu-latest
            install-flags: "--os=linux --cpu=x64"
          # Cross-compiled on x64 rather than run on `ubuntu-latest-arm`: GitHub's shared
          # ARM pool starved this leg on three consecutive releases (v0.1.8 and v0.2.1
          # both shipped without their arm64 tarball; the v0.1.8 retry never once got a
          # runner across ~5 attempts over two days). Bun cross-compiles via
          # `compile.target`, and build.ts installs the native deps for every platform.
          #
          # install-flags track the HOST, not the target: `bun install` here provisions the
          # build tooling that runs on this machine (vite/rollup need
          # @rollup/rollup-linux-x64-gnu). The target's embedded native deps are installed
          # separately by build.ts with `--os="*" --cpu="*"`. Setting these to arm64 fails
          # the Web UI embed step with MODULE_NOT_FOUND.
          - runner: ubuntu-latest
            install-flags: "--os=linux --cpu=x64"
            build-flags: "--target=linux-arm64"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${RAW_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*$'; then
            echo "Refusing to build unrecognised version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.install-flags }}

      - name: Build CLI
        run: bun ./packages/opencode/script/build.ts "$BUILD_FLAGS"
        env:
          # Static matrix literal, not event input. Passed via env rather than interpolated
          # into the shell so the pattern stays safe if it ever becomes dynamic.
          BUILD_FLAGS: ${{ matrix.build-flags || '--single' }}
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ steps.version.outputs.value }}
          OPENCODE_RELEASE: "1"
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The release is built as a draft so nobody can land on a "Latest" page whose DMG is
  # still uploading. Only once desktop and every CLI leg has succeeded is it made public,
  # which is also when the updater may first see latest-mac.yml. If any leg failed, the
  # release stays a draft: an incomplete release is strictly worse than a late one.
  finalize:
    needs: [desktop, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${RAW_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*$'; then
            echo "Refusing to finalize unrecognised version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify every expected asset is present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.value }}
        run: |
          expected="opencode-desktop-mac-arm64.dmg
          opencode-desktop-mac-arm64.zip
          latest-mac.yml
          opencode-darwin-arm64.zip
          opencode-darwin-x64.zip
          opencode-linux-x64.tar.gz
          opencode-linux-arm64.tar.gz"
          actual="$(gh release view "$TAG" --json assets -q '.assets[].name')"
          missing=0
          while IFS= read -r name; do
            name="$(printf '%s' "$name" | xargs)"
            [ -z "$name" ] && continue
            if ! printf '%s\n' "$actual" | grep -qx "$name"; then
              echo "MISSING: $name" >&2
              missing=1
            fi
          done <<< "$expected"
          if [ "$missing" -ne 0 ]; then
            echo "Leaving $TAG as a draft — an incomplete release is worse than a late one." >&2
            exit 1
          fi
          echo "All expected assets present on $TAG."

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.value }}
        run: gh release edit "$TAG" --draft=false --latest
