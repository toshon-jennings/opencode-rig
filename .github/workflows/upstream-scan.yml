# Warns early when Rig falls behind upstream or Zen stops serving it free models. It never merges or opens PRs:
# `script/upstream-scan.ts` keeps one rolling issue current and comments on it when something needs you.
name: upstream-scan

on:
  schedule:
    # Daily, so a Zen refusal is caught the day it starts; the merge digest is only posted on Mondays.
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The merge forecast diffs Rig's history against its upstream base.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Scan upstream
        env:
          GH_TOKEN: ${{ github.token }}
          # Without this, gh picks the `upstream` remote the scan adds and acts on anomalyco/opencode.
          GH_REPO: ${{ github.repository }}
        run: bun run upstream:scan
