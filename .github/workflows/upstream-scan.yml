# This fork deliberately does not track upstream. This job never rebases or opens PRs —
# it only reports whether upstream changed anything under the watched paths, and files an
# issue when it did, so nobody has to remember to check.
#
# The report is passed by file, never interpolated into a shell command, because it
# embeds upstream-authored commit messages.
name: upstream-scan

on:
  schedule:
    # 14:00 UTC every Monday. Watched paths change on ~87% of upstream's active days
    # (measured over a 90-day window), so monthly left too much room for a provider or
    # auth change to sit unreported; weekly caps the exposure at a week.
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the scan advances a cursor tag after each run so it only ever
      # reports what's new since the last check, instead of the fork's entire (and
      # permanently growing, since this fork never merges upstream) unmerged backlog.
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The scan diffs against upstream and reads/moves a cursor tag, so a shallow,
          # tag-less clone has nothing to compare against or advance.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Scan upstream
        id: scan
        run: bun run upstream:scan

      - name: Report watched-path changes
        if: steps.scan.outputs.watched != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.scan.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '\n— [upstream-scan](%s) · run `bun run upstream:scan` locally.\n' "$RUN_URL" >> "$REPORT"
          gh label create upstream-scan --color ededed \
            --description "Upstream changed a watched path" --force
          # One rolling issue: comment on the open one if it exists, otherwise open it.
          existing=$(gh issue list --state open --label upstream-scan --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$REPORT"
          else
            gh issue create --title "Upstream touched watched paths" \
              --label upstream-scan --body-file "$REPORT"
          fi
