# Temporary. GitHub's shared ubuntu-latest-arm runner pool was backed up for hours when
# v0.1.8 shipped, so that CLI leg never got to run and the release is missing
# opencode-linux-arm64.tar.gz. This checks back periodically and re-dispatches the full
# release workflow (the matrix isn't parameterized to build a single leg) until the asset
# shows up or a cutoff passes, then disables itself either way.
#
# Delete this file once v0.1.8 has all its assets — it has no reason to outlive that gap.
name: release-retry-v0.1.8

on:
  schedule:
    # Every 6h, not more often: a retry re-runs the WHOLE release (desktop build +
    # notarization + all 4 CLI legs), not just the missing one — the matrix isn't
    # parameterized to target a single leg. 3-hourly would mean re-notarizing the same
    # desktop app 8x/day for days just to retry one Linux binary.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check for the missing asset, retry or give up
        env:
          GH_TOKEN: ${{ github.token }}
          # 2 days of 6-hourly attempts (8 tries) is plenty of room for a shared runner
          # pool to clear without this running indefinitely if something is actually broken.
          CUTOFF: "2026-08-10T14:30:00Z"
        run: |
          set -euo pipefail

          if gh release view v0.1.8 --json assets -q '.assets[].name' | grep -qx 'opencode-linux-arm64.tar.gz'; then
            echo "opencode-linux-arm64.tar.gz is present on v0.1.8 — done." | tee -a "$GITHUB_STEP_SUMMARY"
            gh workflow disable release-retry-v0.1.8.yml
            exit 0
          fi

          if [ "$(date -u +%s)" -ge "$(date -u -d "$CUTOFF" +%s)" ]; then
            echo "Still missing opencode-linux-arm64.tar.gz as of the $CUTOFF cutoff — giving up. Needs a manual look, not just a queue delay." | tee -a "$GITHUB_STEP_SUMMARY"
            gh workflow disable release-retry-v0.1.8.yml
            exit 0
          fi

          echo "Still missing — re-dispatching the release workflow." | tee -a "$GITHUB_STEP_SUMMARY"
          gh workflow run release.yml -f version=0.1.8
