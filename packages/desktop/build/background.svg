<svg xmlns="http://www.w3.org/2000/svg" width="540" height="380" viewBox="0 0 540 380">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1D1A19"/>
    <stop offset="1" stop-color="#121010"/>
  </linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#C4BDBA"/>
    <stop offset="1" stop-color="#9C9592"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.74" cy="0.61" r="0.52">
    <stop offset="0" stop-color="#FAB283" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#FAB283" stop-opacity="0"/>
  </radialGradient>
  <pattern id="gridlight" width="18" height="18" patternUnits="userSpaceOnUse">
    <path d="M18 0H0V18" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
  </pattern>
  <pattern id="griddark" width="18" height="18" patternUnits="userSpaceOnUse">
    <path d="M18 0H0V18" fill="none" stroke="#000000" stroke-opacity="0.05" stroke-width="1"/>
  </pattern>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0.000" stop-color="#7FD88F"/><stop offset="0.333" stop-color="#56B6C2"/><stop offset="0.667" stop-color="#9D7CD8"/><stop offset="1.000" stop-color="#FAB283"/></linearGradient>
  <linearGradient id="rulefade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
    <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <mask id="rulemask">
    <rect x="174" y="346" width="192" height="3" fill="url(#rulefade)"/>
  </mask>
  <!-- Feathers the plate off the left and right frame edges so it reads as a lit
       area rather than a UI panel. Clear of both icons (x=90..190, x=350..450). -->
  <linearGradient id="platefade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="0.085" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="0.915" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <mask id="platemask">
    <rect x="0" y="142" width="540" height="180" fill="url(#platefade)"/>
  </mask>
</defs>

<rect width="540" height="380" fill="url(#bg)"/>
<rect width="540" height="380" fill="url(#gridlight)"/>

