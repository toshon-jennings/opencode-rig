<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    background: #1B1818;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    -webkit-font-smoothing: antialiased;
  }
  /* Hues below are the opencode dark theme: syntax-string #7FD88F, syntax-property
     #56B6C2, syntax-keyword #9D7CD8, syntax-primitive (primary) #FAB283. */
  .card {
    position: relative;
    width: 1280px; height: 640px;
    padding: 76px 88px;
    display: flex; flex-direction: column;
    overflow: hidden;
    background:
      radial-gradient(820px 440px at 82% 14%, rgba(250, 178, 131, 0.15), transparent 68%),
      radial-gradient(700px 420px at 2% 88%, rgba(86, 182, 194, 0.12), transparent 66%),
      radial-gradient(640px 400px at 54% 108%, rgba(157, 124, 216, 0.10), transparent 70%),
      linear-gradient(160deg, #272221 0%, #1B1818 52%, #141212 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(241, 236, 236, 0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(241, 236, 236, 0.028) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(1100px 620px at 30% 40%, #000 30%, transparent 88%);
  }
  .card > *:not(.grid) { position: relative; }

  .eyebrow { display: flex; align-items: center; gap: 14px; }
  .eyebrow span {
    font-size: 15px; letter-spacing: 0.24em; text-transform: uppercase; color: #8A7F7D;
  }
  .dot { width: 10px; height: 10px; background: #E5C07B; }
  .motif { margin-left: auto; display: flex; gap: 6px; }
  .motif i { width: 10px; height: 10px; }

  .mark { margin-top: 84px; }

  .tagline {
    margin-top: 54px;
    font-size: 27px; line-height: 1.52; letter-spacing: -0.005em; color: #8C8483;
  }
  .tagline b { font-weight: 400; }
  .term { color: #7FD88F; }
  .dash { color: #56B6C2; }
  .self { color: #CFCECD; }

  .base { margin-top: auto; }
  .rule { display: flex; height: 3px; margin-bottom: 40px; }
  .rule i { width: 58px; }
  .rule .tail {
    flex: 1;
    background: linear-gradient(90deg, #3A3332 0%, rgba(58, 51, 50, 0) 88%);
  }

  .foot {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 19px; color: #6E6766;
  }
  .foot .repo { color: #FAB283; }
  .cmd {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    border: 1px solid #383130; border-radius: 3px;
    background: rgba(241, 236, 236, 0.025);
    color: #857D7C;
  }
  .cmd em { color: #7FD88F; font-style: normal; }
  .cmd .bin { color: #FAB283; }
  .cmd .verb { color: #D8D2D1; }
  .cmd .pkg { color: #9D7CD8; }
</style>
